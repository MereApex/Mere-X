    <meta name="description" content="Mere X is an AI research and product company. We build Mere X — a frontier model family engineered for reasoning, safety, and real work." />

    <title>Mere X — Building intelligence that advances humanity</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mere-x.theme") || "light";
          var resolved = saved === "system"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : saved;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = saved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.dataset.motion = "reduced";
        }
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
